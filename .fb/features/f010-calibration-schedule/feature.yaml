fid: f010
slug: calibration-schedule
module: itag_quality
title: Calibration via Maintenance Schedule
depends_on: [f007]
description: >
  Calibration runs on ERPNext's standard Maintenance Schedule. A user picks the item
  and its serial on a Maintenance Schedule line, sets periodicity (Weekly / Monthly /
  Quarterly / Half Yearly / Yearly) and number of visits, and the native Generate
  Schedule fans out the calibration dates into the schedules table. This app adds only
  the serial + its Item Tag to the line, and carries the chosen serial onto each
  generated schedule row. Due calibrations surface through the native Maintenance
  Visit / calendar flow — no custom doctype, scheduler or report.

  Supersedes the original per-serial approach (calibration schedule embedded on the
  Serial No form, auto-generated on receipt, with a daily Task scheduler and a report),
  which was removed in 15.9.0.

status_history: open --> working --> done --> reworked --> done
created: 2026-07-08

components:
  - id: f010-c001
    name: Maintenance Schedule serial + tag fields
    type: fixture
    stage: done
    status_history: open --> done
    source: fixtures/custom_field.json
    responsibility: >
      Two custom fields on Maintenance Schedule Item (module ITAG Quality, in list
      view): custom_serial_no (Link -> Serial No, after item_name) so a user picks a
      single serial per line, and custom_item_tag (Data, read-only,
      fetch_from custom_serial_no.custom_item_tag).

  - id: f010-c002
    name: Carry serial into schedule rows
    type: controller
    stage: done
    status_history: open --> done
    depends_on: [f010-c001]
    source: itag_quality/maintenance_schedule/maintenance_schedule.py, itag_quality/maintenance_schedule/maintenance_schedule.js
    responsibility: >
      before_validate mirrors each line's custom_serial_no into the native serial_no
      field, so ERPNext's generate_schedule stamps the serial onto every generated
      schedule row. Client set_query restricts custom_serial_no to serials of the
      row's item_code. Wired via doc_events (before_validate) + doctype_js.
