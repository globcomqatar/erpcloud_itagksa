fid: f010
slug: calibration-schedule
module: itag_quality
title: Calibration via custom Calibration Schedule
depends_on: [f007]
description: >
  Calibration runs on a dedicated Calibration Schedule document owned by this app,
  replacing ERPNext's standard Maintenance Schedule. A user picks the item and its
  serial on a line, sets periodicity (Weekly / Monthly / Quarterly / Half Yearly /
  Yearly) and number of calibrations, and Generate Schedule fans the calibration
  dates into the schedules table. Each line carries an Employee (not a Sales Person);
  customer, contact, territory and sales-order fields are dropped.

  Items can be flagged as calibration items (with a periodicity and calibration count);
  when a serial of such an item is created — manually or from a stock receipt — its
  Calibration Schedule is raised automatically. A schedule raised from a receipt links
  back to its Stock Entry / Purchase Receipt and appears in that voucher's Connections tab.

  After submission the schedules table stays editable so a visit can be rescheduled or
  marked Skipped without cancelling. A Create Material Request button on a submitted
  schedule opens an unsaved calibration-service Material Request pre-filled with each
  calibration item + serial (main stock item added by the operator; no automation).

  Supersedes the 15.9.0 approach that rode on the standard Maintenance Schedule, which
  in turn superseded the original per-serial approach (calibration schedule on the
  Serial No form, daily Task scheduler and report) removed in 15.9.0.

  Restructured 2026-07-23 (c008): the calibration plan is configured on the schedule,
  not the Item. Periodicity is gone — the operator enters Purchase Date, End of Life
  Date and No of Calibrations, and the calibrations are spaced evenly between the two
  dates. Generation is button-driven only. The Calibration Schedule Item child table
  is deleted; the Item keeps just the is-calibration-item flag.

status_history: open --> working --> done --> reworked --> done --> extended --> done --> pivoted-to-custom-doctype --> done --> extended --> done --> restructured --> done
created: 2026-07-08

components:
  - id: f010-c001
    name: Calibration Schedule doctype
    type: doctype
    stage: done
    status_history: open --> done --> restructured --> done
    source: itag_quality/doctype/calibration_schedule, itag_quality/doctype/calibration_schedule_detail
    responsibility: >
      Submittable Calibration Schedule (module ITAG Quality) with one child table,
      Calibration Schedule Detail. Header: item_code, serial_no (Link -> Serial No,
      single calibration serial), item_tag (fetch from serial), purchase_date,
      end_of_life_date, no_of_calibrations, employee (Link -> Employee). Detail row:
      item, serial, scheduled_date, actual_date, completion_status, employee.
      No customer/contact/territory/sales-order fields. The Calibration Schedule Item
      child table was deleted in c008 — the header is the only input.

  - id: f010-c002
    name: Schedule generation controller
    type: controller
    stage: done
    status_history: open --> done --> restructured --> done
    depends_on: [f010-c001]
    source: itag_quality/doctype/calibration_schedule/calibration_schedule.py, itag_quality/doctype/calibration_schedule/calibration_schedule.js
    responsibility: >
      CalibrationSchedule controller generates the visit rows from the header:
      calibrations spaced evenly between purchase_date and end_of_life_date, the last
      one landing on end_of_life_date, each pulled back off a holiday (list from the
      employee, or the company default; fetched once per run). Client set_query
      restricts serial_no to the header's item_code. Rewritten in c008 — the ported
      Maintenance Schedule periodicity logic is gone.

  - id: f010-c003
    name: Auto-raise schedule on receipt
    type: controller
    stage: done
    status_history: open --> done --> restructured --> done
    depends_on: [f010-c001]
    source: itag_quality/calibration.py, itag_quality/calibration_dashboard.py
    responsibility: >
      Item marker custom_is_calibration_item only — the frequency and count markers were
      dropped in c008, so the raised schedule is a draft the operator completes. Serial
      No after_insert and inward Serial and Batch Bundle on_submit call
      create_calibration_schedule, which raises
      one Calibration Schedule per calibration serial. Idempotent on the line serial_no;
      covers every inward voucher via the universal Serial and Batch Bundle carrier.
      Receipt-raised schedules store the source voucher (source_document_type +
      source_document Dynamic Link, mirroring the bundle's voucher_type / voucher_no);
      override_doctype_dashboards wires Calibration Schedule into the Stock Entry and
      Purchase Receipt Connections tabs via that dynamic link. The bundle's posting_date
      seeds purchase_date (Serial No carries no purchase date in v15); a manually created
      serial falls back to today.

  - id: f010-c004
    name: Post-submit edit + Material Request handoff
    type: controller
    stage: done
    status_history: open --> done --> extended --> done
    depends_on: [f010-c001, f010-c002]
    source: itag_quality/doctype/calibration_schedule/calibration_schedule.py, itag_quality/doctype/calibration_schedule/calibration_schedule.js, itag_quality/doctype/calibration_schedule_detail/calibration_schedule_detail.json, fixtures/custom_field.json
    responsibility: >
      Schedules Detail table is allow_on_submit with editable scheduled_date /
      actual_date / completion_status (adds a "Skipped" status) so a submitted
      schedule's visits can be delayed or skipped in place. validate() item
      recompute + generate_schedule and on_update's Draft stamp are guarded to
      docstatus == 0 so post-submit saves don't throw UpdateAfterSubmitError or
      flip status back to Draft. make_material_request (whitelisted) builds an
      unsaved calibration-service Material Request (custom_is_collaboration_service_po,
      type Purchase) with one row per calibration item/serial forwarded to
      custom_sub_item + custom_serial_no; the operator adds the main stock item.
      Client Create > Material Request button via frappe.model.open_mapped_doc. No
      auto-creation of Material Requests anywhere. Each MR item row carries its
      visit's calibration date (custom_calibration_date on Material Request Item);
      the MR header custom_calibration_date is set when all chosen visits share one
      date, else left blank with an orange notice pointing to the per-row dates.

  - id: f010-c005
    name: Header-driven item / serial / tag
    type: doctype
    stage: done
    status_history: open --> done --> restructured --> done
    created: 2026-07-15
    depends_on: [f010-c001, f010-c002]
    source: itag_quality/doctype/calibration_schedule/calibration_schedule.json, itag_quality/doctype/calibration_schedule/calibration_schedule.py, itag_quality/doctype/calibration_schedule/calibration_schedule.js
    responsibility: >
      Item Code, Serial No, Item Tag plus the scheduling inputs live on the
      Calibration Schedule header; item_code/serial_no/item_tag are in_list_view.
      The header is the only source of truth — validate() copies the serial's Item
      Tag onto the header (fill_item_tag) and checks the date window; generation
      reads the header directly. One serialised item per schedule. serial_no
      set_query sits on the header. In c008 the mirrored items row (sync_item_row)
      was deleted along with the child table, and the scheduling inputs became
      purchase_date / end_of_life_date / no_of_calibrations.

  - id: f010-c006
    name: Item Tag fill on receipt-raised schedules
    type: controller
    stage: done
    status_history: open --> done
    created: 2026-07-15
    depends_on: [f010-c003, f007-c002]
    source: itag_quality/calibration.py, hooks.py
    responsibility: >
      Fixes the Item Tag staying blank on a schedule auto-raised from a receipt.
      The schedule is raised at Serial and Batch Bundle on_submit — before
      bind_item_tags (f007-c002) writes each row's tag onto its serials — so the
      tag does not exist yet. New stamp_schedule_item_tags, wired LAST on Purchase
      Receipt + Stock Entry on_submit (after bind_item_tags), copies each incoming
      serial's now-bound tag onto the schedule header and the visit rows that
      carry it (db.set_value, blanks only). The manual path is covered by
      create_calibration_schedule setting the header tag directly (serial already
      tagged) — no fetch_from reliance. Purchase Receipt on_submit converted from a
      single hook to a list.

  - id: f010-c007
    name: Pending-this-month report + bulk Material Request
    type: report
    stage: done
    status_history: open --> done
    created: 2026-07-15
    depends_on: [f010-c001, f010-c004]
    source: itag_quality/report/calibration_due_this_month/, itag_quality/doctype/calibration_schedule/calibration_schedule.py
    responsibility: >
      Script Report "Calibration Due This Month" lists Pending visits
      (Calibration Schedule Detail) whose scheduled_date falls in the filter window
      (defaults to the current month) on submitted schedules, one row per visit with
      a hidden visit name for selection; filters from_date/to_date/company; roles
      Quality Manager/User + Stock User. Columns show item name and employee name
      (not the codes); get_datatable_options enables the checkbox column so visits can
      be ticked. Detail rows carry employee_name (fetch_from employee, stamped in
      generate_schedule since fetch_from does not fire on programmatic set). A "Create Material Request" button raises
      calibration-service MRs for the ticked visits — frappe.confirm asks Combine
      (one MR) vs per-schedule (default). make_bulk_material_requests groups by
      schedule (or all-in-one), inserts draft MRs and returns their names/links.
      Unlike the single-schedule button (returns an unsaved doc), bulk saves drafts,
      so each row is made valid with item_code = the calibration item, qty 1 and the
      visit date for the operator to refine. Inserted with ignore_permissions so the
      Quality staff the report is offered to (who lack Material Request create) can raise
      them from this controlled endpoint. make_material_request refactored to share
      _new_calibration_mr / _append_calibration_visit / _set_header_calibration_date.

  - id: f010-c008
    name: Purchase-to-end-of-life calibration plan
    type: controller
    stage: done
    status_history: open --> done
    created: 2026-07-23
    depends_on: [f010-c001, f010-c002, f010-c003, f010-c005]
    source: itag_quality/doctype/calibration_schedule/calibration_schedule.json, itag_quality/doctype/calibration_schedule/calibration_schedule.py, itag_quality/doctype/calibration_schedule_detail/calibration_schedule_detail.json, itag_quality/calibration.py, itag_stock/doctype/item_request_form/item_request_form.json, itag_stock/doctype/item_request_form/item_request_form.py, patches/drop_item_calibration_config_fields.py, patches.txt
    responsibility: >
      Moves the calibration plan off the Item and onto the schedule. Header fields
      start_date / end_date / periodicity / no_of_visits are replaced by purchase_date
      (reqd), end_of_life_date and no_of_calibrations; the calibrations are spaced
      evenly across the window ((eol - purchase) / count), the last landing on
      end_of_life_date, a date on a holiday pulled back a day. end_of_life_date and
      no_of_calibrations are deliberately not reqd so a receipt-raised draft can be
      inserted blank; generate_schedule enforces them instead.

      Generation is button-driven only — the validate() auto-regenerate is gone, so
      visits change only when the operator presses Generate Calibration Schedule
      (button hidden after submit). generate_schedule ends in self.save(): a whitelisted
      doc method only hands the mutated doc back to the client (frappe.handler
      run_doc_method never persists), and with validate() no longer regenerating there
      is no other writer, so without the save the rows vanish on reload. The client
      blocks the button on an unsaved document, which that save would have nothing to
      write to. Deleted: the Calibration Schedule Item doctype and
      its mirror/compare code (sync_item_row, items_changed, visit_count_mismatch,
      validate_details, validate_dates_with_periodicity, apply_periodicity_dates,
      DAYS_IN_PERIOD), plus the orphaned item_reference field on Calibration Schedule
      Detail. avoid_holidays became a module function taking a pre-fetched holiday list
      (was one query per visit).

      Item keeps custom_is_calibration_item only; custom_calibration_frequency and
      custom_no_of_calibrations are dropped from the Item Request Form (its own fields
      and the Item it creates). Those three Item fields ship in no app's fixtures — they
      exist only on the site, so the two dead ones cannot be retired by a fixture edit.
      Patch drop_item_calibration_config_fields (post_model_sync) deletes them and the
      Calibration Schedule Item doctype, which migrate leaves orphaned when an app drops
      it; both are guarded so the patch is a no-op on a site already clean or freshly
      installed.
