fid: f011
slug: inward-quality-inspection
module: itag_quality
title: Inward Quality Inspection per serial on a Stock Entry
depends_on: [f002, f003]
description: >
  Gives the Stock Entry "Quality Verification Required" checkbox
  (custom_inward_inspection_required) something to do. The checkbox already existed —
  the CPI GRN mapper sets it on every Material Receipt raised from a Sales Order — but
  nothing read it, so it was a display-only marker.

  On a saved Stock Entry carrying the flag — draft or submitted — a Create Quality
  Inspection button raises one draft Incoming Quality Inspection per received serial
  number, across every incoming row. One inspection per serial (not per row) so a mixed
  receipt can be part accepted and part rejected. A success message links to the Quality
  Inspection list filtered to that Stock Entry.

  Inspection on the draft receipt is the point: the material is checked before it is
  accepted into stock. The consequence is that an inspection raised on a draft cannot be
  submitted until the receipt is — its serial does not exist as a record yet (see c001).

  No submit gate: the button is an operator action, not a validation. The inspections
  are drafts — readings and the Accepted / Rejected call stay with the inspector.

status_history: open --> done
created: 2026-07-23

components:
  - id: f011-c001
    name: Per-serial inspection builder
    type: controller
    stage: done
    status_history: open --> done
    source: itag_quality/inward_inspection.py
    responsibility: >
      Whitelisted create_quality_inspections(stock_entry) builds one draft Quality
      Inspection per received serial: inspection_type Incoming, reference Stock Entry,
      item_code and batch_no from the row, item_serial_no the serial, sample_size 1.
      Returns the names created.

      Works on a draft receipt, which is where incoming inspection belongs; only a
      cancelled Stock Entry is refused. Serial No records are created when the Stock
      Entry is submitted, so on a draft item_serial_no names a record that does not exist
      yet and a plain insert dies with LinkValidationError. Inserted with
      ignore_links instead: the field holds the name the serial will be given, so the
      link resolves the moment the receipt is submitted. Link validation still runs when
      the inspector submits the inspection — verified to throw — so a serial that was
      never actually received cannot be signed off, and an inspection raised on a draft
      stays a draft until its receipt is submitted.
      inspected_by is set explicitly to the session user:
      the field's "user" default is resolved by the form layer, and frappe.new_doc
      server-side only resolves "__user", so it would otherwise insert the literal
      string. Serials are read from the row's own serial_no field falling back to its
      Serial and Batch Bundle — both carriers occur in live data depending on the Stock
      Settings 'Use Serial / Batch Fields' toggle. Outgoing rows (s_warehouse set) are
      skipped, matching the convention in receipt_tag and calibration.

      Idempotent: serials already inspected on this Stock Entry (docstatus < 2) are
      skipped, so the button can be pressed again and returns an empty list when there
      is nothing new. A Stock Entry with no serials at all throws instead.

      Readings come from the Item's Quality Inspection Template via ERPNext's own
      QualityInspection.validate; company is stamped from the Stock Entry. ERPNext's
      validate_inspection_required does not gate Stock Entry references, so no
      Item-level inspection flag is needed.

  - id: f011-c002
    name: Create Quality Inspection button
    type: client
    stage: done
    status_history: open --> done
    depends_on: [f011-c001]
    source: itag_quality/stock_entry_inspection.js, hooks.py
    responsibility: >
      Stock Entry refresh adds a Create Quality Inspection button when
      custom_inward_inspection_required is checked, the entry is saved and not cancelled.
      Saved because the inspections reference it by name; ticking the checkbox dirties
      the form, so the button appears on the save that follows. On success a green
      msgprint reports the count and links to
      /app/quality-inspection?reference_type=Stock Entry&reference_name=<name>, which the
      desk router opens as a filtered list. When every serial is already inspected the
      message is an orange "nothing to create" instead. Registered as a fourth Stock
      Entry entry in doctype_js. Superseded in c003: the button is now added only when
      the server says there is something left to inspect and the user holds the role.

  - id: f011-c003
    name: Button hidden when done or unauthorised
    type: controller
    stage: done
    status_history: open --> done
    created: 2026-07-28
    depends_on: [f011-c001, f011-c002]
    source: itag_quality/inward_inspection.py, itag_quality/stock_entry_inspection.js, itag_manufacturing/doctype/itag_ksa_settings/
    responsibility: >
      New whitelisted may_create_quality_inspections(stock_entry) answers both questions
      the form cannot: pending_serials(source) is empty once every received serial has an
      inspection, and user_may_inspect() checks the new ITAG KSA Settings field
      inward_inspection_role (Link -> Role) against frappe.get_roles(). The form calls it
      on refresh and only then adds the button, and calls frm.refresh() after creating so
      the button clears itself. An empty role setting stays open — the alternative locks
      every user out of the receipt flow until someone fills the field in.

      create_quality_inspections enforces the same role with a PermissionError: the
      whitelisted method is reachable regardless of what the form drew. Serials live in a
      Serial and Batch Bundle as often as on the row, so the pending count cannot be
      worked out client-side.

  - id: f011-c004
    name: Return to the Stock Entry on submit
    type: client
    stage: done
    status_history: open --> done
    created: 2026-07-28
    depends_on: [f011-c001]
    source: itag_quality/quality_inspection/quality_inspection.js, hooks.py
    responsibility: >
      Quality Inspection on_submit routes back to the referenced Stock Entry when
      reference_type is Stock Entry — the inspector is working through one receipt's
      serials, so landing back on the receipt is the next step rather than the submitted
      inspection. Inspections referencing anything else are left where they are. First
      Quality Inspection entry in doctype_js.

  - id: f011-c005
    name: Quality Inspection in Stock Entry Connections
    type: controller
    stage: done
    status_history: open --> done
    created: 2026-07-29
    depends_on: [f011-c001]
    source: itag_quality/calibration_dashboard.py
    responsibility: >
      The Stock Entry Connections tab now counts and links the Quality Inspections raised
      from the receipt, next to the Calibration Schedule already there. Both live in the
      same "Quality" group.

      A Quality Inspection names its voucher with the reference_type / reference_name
      pair, not a plain Link, so non_standard_fieldnames alone is not enough — it would
      match on reference_name only and count an inspection belonging to a Purchase
      Receipt that happens to share the name. The dynamic_links entry
      {"reference_name": ["Stock Entry", "reference_type"]} pins the doctype. Frappe
      honours it in both places that matter: the count in
      desk/notifications.py::get_dynamic_link_filters and the click-through filter in
      form/dashboard.js::get_document_filter.

      No hooks.py change — override_doctype_dashboards already routes Stock Entry here.
      The two register helpers each set their own link fields and return their item name;
      stock_entry and purchase_receipt build the Quality group from what they support,
      so the Purchase Receipt dashboard is untouched.

  - id: f011-c006
    name: Serial stored in a Select, not the Serial No link
    type: controller
    stage: done
    status_history: open --> done
    created: 2026-07-29
    depends_on: [f011-c001]
    source: itag_quality/inward_inspection.py, itag_quality/quality_inspection/quality_inspection.js, install.py, hooks.py
    responsibility: >
      The received serial now goes in custom_inward_serial_no (Select) instead of the
      standard item_serial_no (Link -> Serial No). Inspection happens on the draft receipt,
      before the Serial No records exist, so the Link field threw "does not exist" the
      moment an inspector touched the serial and saved. c001 only worked around this at
      insert time with ignore_links; the form has no such lever, so every later save failed.
      A Select has no target to resolve and stores the text as-is: base_document.py:894
      skips option validation when the docfield carries no options, which this one does not.

      custom_inward_serial_no is owned by quality_itagksa (module Quality ITAG KSA), which
      fills its options client-side for Job Card references and blanks them for everything
      else. It is deliberately NOT in this app's fixtures: fixtures upsert by name, so
      shipping it would rewrite the record's module and leave whichever app migrated last
      as the owner. install.after_migrate calls create_custom_field instead, which inserts
      only when no field of that fieldname exists — so the live record is untouched here and
      the field still gets created on a site without quality_itagksa.

      The form sets the Select's options to the stored value and locks both serial fields
      for Stock Entry references, in refresh rather than onload because quality_itagksa's
      onload clears the options first. item_serial_no is locked rather than hidden so
      inspections raised before this change still show the serial they hold.

      already_inspected_serials reads both fields for the same reason — reading only the
      new one would re-offer those serials and duplicate their inspections. ignore_links
      stays on insert: batch_no is a Link to Batch, and a batch named on a draft receipt is
      only created when that receipt is submitted.
