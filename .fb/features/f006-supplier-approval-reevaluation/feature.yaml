fid: f006
slug: supplier-approval-reevaluation
module: itag_ksa_buying
title: Supplier Approval + Re-Evaluation Freeze
description: >
  Supplier Approval tab with re-evaluation lifecycle. The tab (built via UI as
  Custom Fields under module Itag Ksa Buying) holds initial approval date, a
  re-evaluation frequency (1-5 years), last/next re-evaluation dates, a
  Supplier Documents child table (each row a document type + expiry date), plus
  document checkboxes, scope and comments. Next Re-Evaluation Date is computed
  on save = last re-evaluation date (or initial approval date if never
  re-evaluated) + frequency. A daily scheduler freezes a supplier (standard
  is_frozen) once its next re-evaluation date is due or any of its documents has
  expired; unfreezing is manual. The Approval tab is shown only to the role
  configured in ITAG KSA Settings (reevaluation_role).

status_history: open --> working --> done
created: 2026-07-06

components:
  - id: f006-c001
    name: Supplier approval custom fields
    type: fixture
    stage: done
    status_history: open --> done
    source: fixtures/custom_field.json (module Itag Ksa Buying)
    responsibility: >
      Supplier custom fields under the Supplier Approval tab: custom_supplier_approval
      (Tab Break), custom_initial_approval_date, custom_frequency_of_reevaluation
      (Select 1-5 years), custom_last_reevaluation_date (Date), custom_next_reevaluation_date,
      custom_document_type (Table -> Supplier Documents), document checkboxes,
      scope and comments; plus custom_supplier_cr_number / custom_supplier_cr_expiry.
      Built via Customize UI; fixed custom_last_reevaluation_date from Data to Date.
      Now captured by extending the Custom Field / Property Setter fixture filters
      to include module "Itag Ksa Buying". Child doctypes Supplier Documents
      (document_name -> Supplier Docs, expiry_date) and Supplier Docs (prompt-named
      master) were pre-existing scaffolding.

  - id: f006-c002
    name: Next re-evaluation date compute
    type: controller
    stage: done
    status_history: open --> working --> done
    depends_on: [f006-c001]
    source: itag_ksa_buying/supplier/supplier.py
    responsibility: >
      validate delegates to set_next_reevaluation_date: base = last re-evaluation
      date or initial approval date; next = base + frequency years (leading int
      parsed from the Select label). No-op when base or frequency is missing.
      Wired via doc_events Supplier.validate.

  - id: f006-c003
    name: Daily auto-freeze scheduler
    type: controller
    stage: done
    status_history: open --> working --> done
    depends_on: [f006-c001]
    source: itag_ksa_buying/tasks.py
    responsibility: >
      freeze_lapsed_suppliers (daily): sets is_frozen on unfrozen, enabled
      suppliers whose next re-evaluation date is due (<= today) or which have any
      Supplier Documents row past its expiry_date; leaves a timeline comment
      naming the trigger. Only ever sets is_frozen (unfreeze is manual); commits
      at end; ignore_permissions on all reads. Date filters carry an explicit
      "is set" (IS NOT NULL) guard — without it Frappe get_all "<=" matched
      NULL-date rows and froze every supplier.

  - id: f006-c004
    name: Approval-tab role visibility
    type: client_script
    stage: done
    status_history: open --> done
    depends_on: [f006-c001]
    source: itag_ksa_buying/supplier/supplier.js
    responsibility: >
      On refresh, read reevaluation_role from ITAG KSA Settings and hide the
      custom_supplier_approval tab unless the user has that role (shown to
      everyone when the role is unset). UI visibility only, not a security
      boundary. Wired via doctype_js.

  - id: f006-c005
    name: hooks wiring
    type: config
    stage: done
    status_history: open --> done
    source: hooks.py
    responsibility: >
      Add Supplier validate doc_events; add scheduler_events daily
      freeze_lapsed_suppliers; add Supplier doctype_js; extend the Custom Field
      and Property Setter fixture filters with module "Itag Ksa Buying".
